[project]
name = "app"
version = "1.0"
description = ""
authors = [
    {name = "Jonkkeyler333",email = "82979079+Jonkkeyler333@users.noreply.github.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard] (>=0.139.2,<0.140.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "beanie (>=2.1.0,<3.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)"
]

[tool.poetry]
# Esta línea le dice a Poetry: "Mi código instalable se llama 'app' y vive dentro de 'src'"
packages = [{include = "app", from = "src"}]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)"
]
