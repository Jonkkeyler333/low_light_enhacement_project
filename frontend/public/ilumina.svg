<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="enhanceBeam" x1="120" y1="390" x2="390" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="brightSide" x1="200" y1="120" x2="400" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <linearGradient id="darkSide" x1="100" y1="200" x2="250" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkleFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="white" stroke-opacity="0.08" stroke-width="4" fill="none"/>

  <path d="M 120 390 L 390 120 L 440 170 L 170 440 Z" fill="url(#enhanceBeam)" filter="url(#softGlow)" />

  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="12" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#brightSide)" stroke-width="12" stroke-dasharray="240 700" stroke-linecap="round" filter="url(#neonGlow)"/>

  <path d="M 256 126 A 130 130 0 0 0 256 386 L 256 256 Z" fill="url(#darkSide)" opacity="0.85"/>
  <path d="M 256 126 A 130 130 0 0 1 256 386 L 256 256 Z" fill="url(#brightSide)" opacity="0.95" filter="url(#neonGlow)"/>

  <line x1="126" y1="386" x2="386" y2="126" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)"/>

  <circle cx="256" cy="256" r="64" fill="#0B0F19"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="url(#brightSide)" stroke-width="6" opacity="0.8"/>

  <circle cx="180" cy="200" r="3" fill="#64748B" opacity="0.6"/>
  <circle cx="210" cy="310" r="2.5" fill="#64748B" opacity="0.5"/>
  <circle cx="160" cy="280" r="2" fill="#64748B" opacity="0.7"/>

  <g transform="translate(340, 160)" filter="url(#sparkleFilter)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#sparkleGrad)"/>
  </g>
  <g transform="translate(380, 260) scale(0.65)" filter="url(#sparkleFilter)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(300, 340) scale(0.45)" filter="url(#sparkleFilter)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#sparkleGrad)"/>
  </g>
</svg>
